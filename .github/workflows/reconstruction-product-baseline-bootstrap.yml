name: Reconstruction product-baseline bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - reconstruction/reference-factory-0.7a2
    paths:
      - "extensions/product-baseline/src/**"
      - "product_lab/export_schemas.py"
      - ".github/workflows/reconstruction-product-baseline-bootstrap.yml"

permissions:
  contents: write

jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CAD-free contracts
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -e extensions/product-baseline
      - name: Generate deterministic schemas
        run: python product_lab/export_schemas.py --write
      - name: Commit generated contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/product-baseline/contracts
          if git diff --cached --quiet; then
            echo "Schemas already current."
            exit 0
          fi
          git commit -m "reconstruction: commit generated product baseline schemas"
          git push origin HEAD:reconstruction/reference-factory-0.7a2
