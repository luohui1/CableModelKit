name: Apply thermal contract package

on:
  push:
    branches:
      - 'reconstruction/reference-factory-0.7a2'
    paths:
      - '.github/thermal-contract-package.json.gz.b64'
      - '.github/workflows/apply-thermal-contract-package.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify package payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import json

          root = Path.cwd().resolve()
          encoded = Path('.github/thermal-contract-package.json.gz.b64').read_text(encoding='utf-8').strip()
          payload = json.loads(gzip.decompress(base64.b64decode(encoded)).decode('utf-8'))
          expected = {
              'extensions/thermal-contract/pyproject.toml': 'dd9909c1be159136086ff9d5c09c7b2e796ccfc904eb1d674bfbde146ab5e8ca',
              'extensions/thermal-contract/README.md': 'd3f63399edb6d4e9904af44559eb4c6d0a63dc6c48a5273df6762621aed330cb',
              'extensions/thermal-contract/src/cable_modelkit_thermal_contract/__init__.py': '0f010be4e6259aef25190cca29c00f7de1f971c60e4cb29f117a041f6508cb21',
              'extensions/thermal-contract/src/cable_modelkit_thermal_contract/models.py': 'd7dfb82b7349614277e159a319ac6add00a8643f59e96dc7cef54ed3ac80026b',
              'extensions/thermal-contract/src/cable_modelkit_thermal_contract/builder.py': '02023e7c29209ef886644ad1433fc100bc23f4ce1ec3fe36f962ce6486c9cf56',
              'extensions/thermal-contract/src/cable_modelkit_thermal_contract/cli.py': '2718420819f64478bd7b34ba725d7c292829ecbeca0a4e2300fb9bcf1a7686a2',
              'extensions/thermal-contract/tests/test_thermal_contract.py': '791ccd78e248f58dc756b0066bebdced06b9cd5b1516604101972208d02efe0c',
              'thermal_lab/radial-benchmark.json': '40d87a4af96fbd2a64121bc7d85b109477bc6e472fbafa9105b26bf985520eb7',
          }
          if set(payload) != set(expected):
              raise SystemExit(f'payload path mismatch: {sorted(payload)}')
          for relative, content in payload.items():
              if not isinstance(relative, str) or not isinstance(content, str):
                  raise SystemExit('payload must map relative paths to UTF-8 text')
              target = (root / relative).resolve()
              if root not in target.parents:
                  raise SystemExit(f'unsafe payload path: {relative}')
              digest = hashlib.sha256(content.encode('utf-8')).hexdigest()
              if digest != expected[relative]:
                  raise SystemExit(f'payload digest mismatch for {relative}: {digest}')
              if target.exists():
                  raise SystemExit(f'refusing to overwrite existing path: {relative}')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          for relative in (
              'extensions/thermal-contract/src/cable_modelkit_thermal_contract/__init__.py',
              'extensions/thermal-contract/src/cable_modelkit_thermal_contract/models.py',
              'extensions/thermal-contract/src/cable_modelkit_thermal_contract/builder.py',
              'extensions/thermal-contract/src/cable_modelkit_thermal_contract/cli.py',
              'extensions/thermal-contract/tests/test_thermal_contract.py',
          ):
              source = Path(relative).read_text(encoding='utf-8')
              compile(source, relative, 'exec')
          PY
          git diff --check

      - name: Commit solver-neutral thermal contract package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/thermal-contract-package.json.gz.b64
          git add extensions/thermal-contract thermal_lab
          git commit -m 'feat(thermal): add SI PDE contract and radial analytic benchmark'
          git push origin "HEAD:${GITHUB_REF_NAME}"
