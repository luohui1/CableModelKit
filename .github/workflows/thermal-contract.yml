name: Thermal SI contract and radial analytic benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - 'extensions/thermal-contract/**'
      - 'extensions/topology-conformity/**'
      - 'extensions/engineering-gate/**'
      - 'extensions/section-profile/**'
      - 'thermal_lab/**'
      - 'mesh_lab/**'
      - '.github/workflows/thermal-contract.yml'
  pull_request:
    paths:
      - 'extensions/thermal-contract/**'
      - 'extensions/topology-conformity/**'
      - 'extensions/engineering-gate/**'
      - 'extensions/section-profile/**'
      - 'thermal_lab/**'
      - 'mesh_lab/**'
      - '.github/workflows/thermal-contract.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install native runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa libxrender1

      - name: Install geometry, topology, and thermal contract stack
        run: >-
          python -m pip install
          -e '.[occt]'
          -e extensions/section-profile
          -e extensions/engineering-gate
          -e 'extensions/topology-conformity[mesh,verify]'
          -e 'extensions/thermal-contract[test]'

      - name: Build accepted source and retained conformal mesh
        run: |
          python mesh_lab/make_test_fixture.py out/ci-source
          cable-modelkit-topology build out/ci-source/candidate out/conformal

      - name: Test SI, material, PDE, boundary, and analytic contracts
        env:
          MODELKIT_THERMAL_TOPOLOGY_SOURCE: '${{ github.workspace }}/out/conformal'
          MODELKIT_THERMAL_BENCHMARK_SPEC: '${{ github.workspace }}/thermal_lab/radial-benchmark.json'
        run: >-
          python scripts/run_pytest_ci.py -q extensions/thermal-contract/tests
          --junitxml=out/thermal-contract-tests.xml

      - name: Produce retained thermal contract evidence
        run: >-
          cable-modelkit-thermal-contract prepare
          out/conformal
          thermal_lab/radial-benchmark.json
          out/thermal-contract

      - name: Independently verify retained thermal contract
        run: cable-modelkit-thermal-contract verify out/thermal-contract

      - name: Pin qualification boundary
        run: >-
          python -c "import json; from pathlib import Path;
          d=json.loads(Path('out/thermal-contract/thermal-contract.json').read_text(encoding='utf-8'));
          assert d['status']=='thermal_contract_prepared'; assert d['units']['length_scale_to_si']==0.001;
          assert d['mesh_coordinate_unit']=='mm'; assert d['conformal_shared_topology'] is True;
          assert len(d['mesh_domains'])==4; assert len(d['domain_assignments'])==4;
          assert d['project_material_data_ready'] is False; assert d['analytic_benchmark_ready'] is True;
          assert d['solver_adapter_ready'] is False; assert d['mesh_convergence_ready'] is False;
          assert d['fem_ready'] is False; assert d['simulation_ready'] is False;
          assert d['manufacturing_ready'] is False; assert d['standards_compliance']=='not_assessed';
          assert d['analytic_solution']['relative_energy_balance_error'] < 1e-12;
          print('thermal SI/PDE/boundary contract and analytic energy balance passed without FEM overclaim')"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thermal-contract-evidence
          path: out/
