name: Apply topology mesh sizing fix

on:
  push:
    branches:
      - 'reconstruction/reference-factory-0.7a2'
    paths:
      - '.github/native-topology-size-fix.py'
      - '.github/workflows/apply-topology-size-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate source patch
        run: |
          python .github/native-topology-size-fix.py
          git diff --check

      - name: Commit geometry-aware HXT sizing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/native-topology-size-fix.py
          git add extensions/topology-conformity/src/cable_modelkit_topology_conformity/conformity.py
          git commit -m 'fix(topology): derive HXT size from retained feature scale'
          git push origin "HEAD:${GITHUB_REF_NAME}"
