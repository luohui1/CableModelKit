name: Bootstrap suffix forensics

on:
  workflow_dispatch:
  push:
    branches:
      - engineering/reference-factory-0.7a2
    paths:
      - ".bootstrap/source/**"
      - "tools/bootstrap_forensics.py"
      - "tools/assemble_damaged_bootstrap.py"
      - "tools/scan_recovered_tar.py"
      - "tools/probe_deflate_resync.py"
      - ".github/workflows/suffix-forensics.yml"

jobs:
  salvage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Assemble surviving compressed stream
        run: |
          mkdir -p build
          python tools/assemble_damaged_bootstrap.py \
            --output build/bootstrap-damaged.tar.gz \
            --map build/bootstrap-damaged-map.json
      - name: Install gzip recovery toolkits
        run: |
          sudo apt-get update
          sudo apt-get install -y gzrt gztool cpio
          gzrecover -V
          gztool -h | head -n 8
      - name: Recover with gzrecover
        shell: bash
        run: |
          set +e
          gzrecover -v -o build/bootstrap.tar.gzrecover \
            build/bootstrap-damaged.tar.gz \
            2> build/gzrecover-combined.log
          status=$?
          set -e
          echo "gzrecover combined exit status: $status"
          test -f build/bootstrap.tar.gzrecover
          python tools/scan_recovered_tar.py \
            build/bootstrap.tar.gzrecover \
            --output build/gzrecover-scan.json
      - name: Recover with gztool patch mode
        shell: bash
        run: |
          set +e
          gztool -pWb0 build/bootstrap-damaged.tar.gz \
            > build/bootstrap.tar.gztool \
            2> build/gztool-patch.log
          status=$?
          set -e
          echo "gztool patch exit status: $status"
          test -f build/bootstrap.tar.gztool
          python tools/scan_recovered_tar.py \
            build/bootstrap.tar.gztool \
            --output build/gztool-scan.json
      - name: Probe intact raw-DEFLATE suffix
        run: |
          python tools/probe_deflate_resync.py \
            --output build/deflate-resync.json
      - name: Probe gzrecover split segments
        shell: bash
        run: |
          set +e
          gzrecover -v -s -o build/split-recovered \
            build/bootstrap-damaged.tar.gz \
            2> build/gzrecover-split.log
          status=$?
          set -e
          echo "gzrecover split exit status: $status"
          mkdir -p build/split-scans
          shopt -s nullglob
          for f in build/split-recovered*; do
            if [ -f "$f" ]; then
              base="$(basename "$f")"
              python tools/scan_recovered_tar.py "$f" \
                --output "build/split-scans/${base}.json" || true
            fi
          done
          find build -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > build/file-inventory.tmp
          mv build/file-inventory.tmp build/file-inventory.txt
      - name: Summarize recovery signals
        shell: bash
        run: |
          echo '=== damaged stream ==='
          cat build/bootstrap-damaged-map.json
          echo '=== gzrecover ==='
          cat build/gzrecover-combined.log
          cat build/gzrecover-scan.json
          echo '=== gztool patch mode ==='
          cat build/gztool-patch.log
          cat build/gztool-scan.json
          echo '=== raw DEFLATE resync ==='
          cat build/deflate-resync.json
          echo '=== recovered files ==='
          cat build/file-inventory.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-suffix-forensics
          path: |
            build/bootstrap-damaged-map.json
            build/gzrecover-combined.log
            build/gzrecover-split.log
            build/gzrecover-scan.json
            build/gztool-patch.log
            build/gztool-scan.json
            build/deflate-resync.json
            build/split-scans/
            build/file-inventory.txt
          if-no-files-found: error
