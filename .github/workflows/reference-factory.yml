name: Reference factory

on:
  workflow_dispatch:
  push:
    paths:
      - "extensions/reference-factory/**"
      - "extensions/open-reference/**"
      - "extensions/product-baseline/**"
      - ".github/workflows/reference-factory.yml"
  pull_request:
    paths:
      - "extensions/reference-factory/**"
      - "extensions/open-reference/**"
      - "extensions/product-baseline/**"
      - ".github/workflows/reference-factory.yml"

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install local packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -e extensions/product-baseline -e extensions/open-reference
          python -m pip install -e "extensions/reference-factory[test]"
      - name: Test contracts and compiler
        run: python -m pytest -q extensions/reference-factory/tests
      - name: Build CAD-free reference release
        run: |
          cmk-reference-factory compile build/reference-factory
          cmk-reference-factory verify-release build/reference-factory

  gmsh-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install native runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - name: Install fixed Gmsh and local factory
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -e extensions/product-baseline -e extensions/open-reference
          python -m pip install gmsh==4.15.2 "numpy>=2.1,<3"
          python -m pip install -e "extensions/reference-factory[test]"
          python -c "import gmsh; assert gmsh.__version__ == '4.15.2', gmsh.__version__"
      - name: Run native Physical Groups acceptance smoke
        run: |
          mkdir -p build/gmsh
          cmk-reference-factory gmsh-probe > build/gmsh/capability.json
          cmk-reference-factory gmsh-smoke build/gmsh/reference-factory-smoke.msh
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('build/gmsh/reference-factory-smoke.msh.json').read_text())
          assert data['status']=='passed'
          assert data['runtime_validated'] is True
          assert {g['name'] for g in data['physical_groups']} == {
              'region/conductor','region/insulation',
              'interface/conductor_insulation','boundary/outer',
          }
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gmsh-4.15.2-reference-factory-smoke
          path: build/gmsh
