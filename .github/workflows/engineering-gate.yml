name: Scoped engineering geometry gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'extensions/engineering-gate/**'
      - 'extensions/section-profile/**'
      - '.github/workflows/engineering-gate.yml'
  pull_request:
    paths:
      - 'extensions/engineering-gate/**'
      - 'extensions/section-profile/**'
      - '.github/workflows/engineering-gate.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  geometry:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CABLE_MODELKIT_CI_FAST_EXIT: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pinned geometry runtime and reconstructed gate
        run: python -m pip install -e '.[occt,dev]' -e extensions/section-profile -e extensions/engineering-gate

      - name: Prepare evidence directory
        run: python -c "from pathlib import Path; Path('out').mkdir(exist_ok=True)"

      - name: Tests and bytecode
        run: |
          python -m compileall -q extensions/section-profile/src extensions/engineering-gate/src
          python scripts/run_pytest_ci.py -q extensions/section-profile/tests extensions/engineering-gate/tests --junitxml=out/gate-tests.xml

      - name: Build and accept synthetic 22-domain sample
        run: cable-modelkit-gate build extensions/section-profile/examples/profiled-19.json out/profiled-core

      - name: Pin acceptance boundary
        run: >-
          python -c "import json; from pathlib import Path;
          d=json.loads(Path('out/profiled-core/gate.json').read_text(encoding='utf-8'));
          assert d['status']=='passed'; assert d['domain_count']==22; assert d['interface_count']==21;
          assert d['step_solid_count']==22; assert d['glb_geometry_count']==22;
          assert d['fem_ready'] is False; assert d['simulation_ready'] is False;
          assert d['manufacturing_ready'] is False; assert d['standards_compliance']=='not_assessed';
          print('22-domain engineering gate passed with conservative qualification')"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-gate-${{ matrix.os }}-${{ matrix.python }}
          path: out/
