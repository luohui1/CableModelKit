name: Geometric mesh quality screening

on:
  workflow_dispatch:
  push:
    paths:
      - 'extensions/mesh-quality/**'
      - 'extensions/simulation-prep/**'
      - 'extensions/engineering-gate/**'
      - 'extensions/section-profile/**'
      - 'mesh_lab/**'
      - 'quality_lab/**'
      - '.github/workflows/mesh-quality.yml'
  pull_request:
    paths:
      - 'extensions/mesh-quality/**'
      - 'extensions/simulation-prep/**'
      - 'extensions/engineering-gate/**'
      - 'extensions/section-profile/**'
      - 'mesh_lab/**'
      - 'quality_lab/**'
      - '.github/workflows/mesh-quality.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install native runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa libxrender1

      - name: Install reconstructed geometry-to-quality stack
        run: python -m pip install -e '.[occt]' -e extensions/section-profile -e extensions/engineering-gate -e 'extensions/simulation-prep[mesh,verify]' -e 'extensions/mesh-quality[quality,exchange]' pytest

      - name: Build accepted source and retained preparation mesh
        run: |
          python mesh_lab/make_test_fixture.py out/ci-source
          cable-modelkit-prep prepare out/ci-source/candidate out/prepared --mesh --verify-mesh

      - name: Test mesh screening contracts
        env:
          MODELKIT_QUALITY_SOURCE: '${{ github.workspace }}/out/prepared'
        run: python scripts/run_pytest_ci.py -q extensions/mesh-quality/tests --junitxml=out/quality-tests.xml

      - name: Produce retained quality evidence
        run: cable-modelkit-mesh-quality out/prepared out/quality.json

      - name: Independent one-domain Gmsh quality smoke
        run: python -m quality_lab.gmsh_smoke out/gmsh-smoke

      - name: Pin screening and qualification boundaries
        run: >-
          python -c "import json; from pathlib import Path;
          d=json.loads(Path('out/quality.json').read_text(encoding='utf-8'));
          assert d['status']=='screening_passed'; assert d['mesh_format']=='msh4.1';
          assert d['mesh_coordinate_unit']=='mm'; assert d['expected_domain_count']==4;
          assert d['used_domain_count']==4; assert d['tetrahedron_count']>0;
          assert d['nonfinite_point_count']==0; assert d['degenerate_tetrahedron_count']==0;
          assert d['conformal_shared_topology'] is False; assert d['fem_ready'] is False;
          assert d['simulation_ready'] is False; assert d['standards_compliance']=='not_assessed';
          print('mesh geometric screening passed without FEM overclaim')"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesh-quality-evidence
          path: out/
