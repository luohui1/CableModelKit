[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cable-modelkit-example-plugin"
version = "0.1.0"
description = "Independent CableModelKit entry-point example"
requires-python = ">=3.11,<3.14"
dependencies = ["cable-modelkit>=0.2.1,<0.3", "pydantic==2.13.4"]

[project.entry-points."cable_modelkit.plugins"]
"asset.tube" = "cable_modelkit_example_plugin:AssetTubePlugin"

[tool.setuptools.packages.find]
where = ["src"]
