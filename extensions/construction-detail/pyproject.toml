[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cable-modelkit-construction-detail"
version = "0.1.0"
description = "Construction-detail evidence contracts for CableModelKit"
requires-python = ">=3.11,<3.14"
dependencies = ["cable-modelkit>=0.2.1,<0.3", "pydantic==2.13.4"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]
