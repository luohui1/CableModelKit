[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cable-modelkit-thermal-contract"
version = "0.1.0"
description = "Solver-neutral SI thermal contracts and analytic radial benchmarks for CableModelKit"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cable-modelkit>=0.2.1,<0.3",
  "cable-modelkit-topology-conformity>=0.1,<0.2",
  "pydantic==2.13.4"
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
cable-modelkit-thermal-contract = "cable_modelkit_thermal_contract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
