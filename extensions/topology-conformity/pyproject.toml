[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cable-modelkit-topology-conformity"
version = "0.1.0"
description = "Fragment/imprint topology conformity proof for CableModelKit domains"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cable-modelkit>=0.2.1,<0.3",
  "pydantic==2.13.4"
]

[project.optional-dependencies]
mesh = ["gmsh==4.15.2"]
verify = ["meshio>=5.3,<6"]
test = ["pytest>=9,<10"]

[project.scripts]
cable-modelkit-topology = "cable_modelkit_topology_conformity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
