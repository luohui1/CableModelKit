[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cable-modelkit-thermal-tetra-solver"
version = "0.1.0"
description = "Controlled conformal tetrahedral steady-thermal FEM and convergence evidence for CableModelKit"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cable-modelkit>=0.2.1,<0.3",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "pydantic==2.13.4"
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
cable-modelkit-thermal-tetra = "cable_modelkit_thermal_tetra_solver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
